# This workflow is inactive while stored under proposals/.
# Activation requires a separately reviewed copy at the exact workflow path
# .github/workflows/ci-acceleration-benchmark.yml on the exact branch below.
name: Benchmark coopdiag77 cold and warm without publication

on:
  push:
    branches: [bench/coopdiag77-cache-promotion]
    paths:
      - '.github/workflows/ci-acceleration-benchmark.yml'
      - 'proposals/ci-acceleration/**'

permissions:
  contents: read
  actions: read

# Do not discard half of a measured pair when another push arrives.
concurrency:
  group: coopdiag77-benchmark-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  RPG_DETECT_LEAKS: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  cold:
    if: github.repository == 'Oflodorporto/RPG-POKET-2' && github.event_name == 'push' && github.ref == 'refs/heads/bench/coopdiag77-cache-promotion' && !contains(github.event.head_commit.message, '[exact-rehearsal-only]')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      cache_key: ${{ steps.prepare.outputs.cache_key }}
      artifact_id: ${{ steps.evidence.outputs.artifact-id }}
    steps:
      - name: Checkout orchestrator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: orchestrator
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout pinned product source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 6026fb49db4fe874b9c3f0571cbe4fdb9e66adb3
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare isolated benchmark
        id: prepare
        run: |
          python3 "$GITHUB_WORKSPACE/orchestrator/proposals/ci-acceleration/run_benchmark.py" prepare \
            --source "$GITHUB_WORKSPACE/source" \
            --orchestrator "$GITHUB_WORKSPACE/orchestrator" \
            --work "$RUNNER_TEMP/bench-work" --phase cold
      # Deliberately no cache restore action or automatic save post-action.
      - name: Install verified dependencies
        env:
          LOCK_SHA256: ${{ steps.prepare.outputs.lock_sha256 }}
          CACHE_KEY: ${{ steps.prepare.outputs.cache_key }}
        run: |
          python3 "$GITHUB_WORKSPACE/orchestrator/proposals/ci-acceleration/dependencies/install_dependencies.py" install \
            --phase cold --cache-root "$RUNNER_TEMP/download-cache" \
            --workspace "$RUNNER_TEMP/dependency-work" \
            --expected-lock-sha256 "$LOCK_SHA256" \
            --cache-key "$CACHE_KEY" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --report "$RUNNER_TEMP/bench-work/evidence/dependencies.json" \
            --github-env "$GITHUB_ENV" --github-path "$GITHUB_PATH"
      - name: Run complete benchmark qualification
        env:
          BENCHMARK_CACHE_HIT: "false"
          BENCHMARK_CACHE_KEY: ""
        run: |
          python3 "$GITHUB_WORKSPACE/orchestrator/proposals/ci-acceleration/run_benchmark.py" qualify \
            --source "$GITHUB_WORKSPACE/source" \
            --orchestrator "$GITHUB_WORKSPACE/orchestrator" \
            --work "$RUNNER_TEMP/bench-work" --phase cold
      - name: Verify distributions before save
        env:
          LOCK_SHA256: ${{ steps.prepare.outputs.lock_sha256 }}
        run: |
          python3 "$GITHUB_WORKSPACE/orchestrator/proposals/ci-acceleration/dependencies/install_dependencies.py" verify \
            --cache-root "$RUNNER_TEMP/download-cache" --expected-lock-sha256 "$LOCK_SHA256"
      - name: Cache save
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/download-cache
          key: ${{ steps.prepare.outputs.cache_key }}
          enableCrossOsArchive: false
      - name: Upload benchmark evidence
        id: evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.prepare.outputs.artifact_name || format('benchmark-{0}-{1}-{2}-cold', github.sha, github.run_id, github.run_attempt) }}
          path: ${{ runner.temp }}/bench-work/evidence
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: false
          include-hidden-files: false

  warm:
    needs: cold
    if: github.repository == 'Oflodorporto/RPG-POKET-2' && github.event_name == 'push' && github.ref == 'refs/heads/bench/coopdiag77-cache-promotion' && !contains(github.event.head_commit.message, '[exact-rehearsal-only]')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      artifact_id: ${{ steps.evidence.outputs.artifact-id }}
    steps:
      - name: Checkout orchestrator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: orchestrator
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout pinned product source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 6026fb49db4fe874b9c3f0571cbe4fdb9e66adb3
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare isolated benchmark
        id: prepare
        run: |
          python3 "$GITHUB_WORKSPACE/orchestrator/proposals/ci-acceleration/run_benchmark.py" prepare \
            --source "$GITHUB_WORKSPACE/source" \
            --orchestrator "$GITHUB_WORKSPACE/orchestrator" \
            --work "$RUNNER_TEMP/bench-work" --phase warm
      - name: Require cold cache identity
        env:
          COLD_KEY: ${{ needs.cold.outputs.cache_key }}
          WARM_KEY: ${{ steps.prepare.outputs.cache_key }}
        run: |
          test -n "$COLD_KEY"
          test "$WARM_KEY" = "$COLD_KEY"
      - name: Cache restore
        id: restore
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/download-cache
          key: ${{ steps.prepare.outputs.cache_key }}
          fail-on-cache-miss: true
          enableCrossOsArchive: false
      - name: Require exact warm cache hit
        env:
          CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
          RESTORED_KEY: ${{ steps.restore.outputs.cache-matched-key }}
          EXPECTED_KEY: ${{ steps.prepare.outputs.cache_key }}
        run: |
          if [[ "$CACHE_HIT" != true || "$RESTORED_KEY" != "$EXPECTED_KEY" ]]; then
            echo '::error::Warm benchmark requires the exact cache saved by this cold run and attempt.'
            exit 1
          fi
      - name: Install verified dependencies
        env:
          LOCK_SHA256: ${{ steps.prepare.outputs.lock_sha256 }}
          CACHE_KEY: ${{ steps.prepare.outputs.cache_key }}
          RESTORED_KEY: ${{ steps.restore.outputs.cache-matched-key }}
        run: |
          python3 "$GITHUB_WORKSPACE/orchestrator/proposals/ci-acceleration/dependencies/install_dependencies.py" install \
            --phase warm --cache-root "$RUNNER_TEMP/download-cache" \
            --workspace "$RUNNER_TEMP/dependency-work" --restored-key "$RESTORED_KEY" \
            --expected-lock-sha256 "$LOCK_SHA256" \
            --cache-key "$CACHE_KEY" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --report "$RUNNER_TEMP/bench-work/evidence/dependencies.json" \
            --github-env "$GITHUB_ENV" --github-path "$GITHUB_PATH"
      - name: Run complete benchmark qualification
        env:
          BENCHMARK_CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
          BENCHMARK_CACHE_KEY: ${{ steps.restore.outputs.cache-matched-key }}
        run: |
          python3 "$GITHUB_WORKSPACE/orchestrator/proposals/ci-acceleration/run_benchmark.py" qualify \
            --source "$GITHUB_WORKSPACE/source" \
            --orchestrator "$GITHUB_WORKSPACE/orchestrator" \
            --work "$RUNNER_TEMP/bench-work" --phase warm
      - name: Upload benchmark evidence
        id: evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.prepare.outputs.artifact_name || format('benchmark-{0}-{1}-{2}-warm', github.sha, github.run_id, github.run_attempt) }}
          path: ${{ runner.temp }}/bench-work/evidence
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: false
          include-hidden-files: false

  compare:
    needs: [cold, warm]
    if: always() && github.repository == 'Oflodorporto/RPG-POKET-2' && github.event_name == 'push' && github.ref == 'refs/heads/bench/coopdiag77-cache-promotion' && !contains(github.event.head_commit.message, '[exact-rehearsal-only]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout orchestrator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: orchestrator
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch completed jobs and immutable artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          COLD_ARTIFACT_ID: ${{ needs.cold.outputs.artifact_id }}
          WARM_ARTIFACT_ID: ${{ needs.warm.outputs.artifact_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/comparison"
          gh api --paginate --slurp \
            -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
            > "$RUNNER_TEMP/comparison/jobs.json"
          for phase in cold warm; do
            if [[ "$phase" == cold ]]; then id="$COLD_ARTIFACT_ID"; else id="$WARM_ARTIFACT_ID"; fi
            if [[ ! "$id" =~ ^[1-9][0-9]*$ ]]; then
              printf '%s artifact unavailable; qualification did not produce an accepted upload.\n' "$phase" \
                > "$RUNNER_TEMP/comparison/$phase.unavailable.txt"
              continue
            fi
            gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" \
              > "$RUNNER_TEMP/comparison/$phase.metadata.json"
            gh api -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" \
              > "$RUNNER_TEMP/comparison/$phase.zip"
          done
      - name: Verify and compare complete pair
        if: always()
        env:
          COLD_ARTIFACT_ID: ${{ needs.cold.outputs.artifact_id }}
          WARM_ARTIFACT_ID: ${{ needs.warm.outputs.artifact_id }}
        run: |
          python3 "$GITHUB_WORKSPACE/orchestrator/proposals/ci-acceleration/collect_benchmark.py" \
            --cold-id "$COLD_ARTIFACT_ID" --warm-id "$WARM_ARTIFACT_ID" \
            --cold-zip "$RUNNER_TEMP/comparison/cold.zip" \
            --cold-metadata "$RUNNER_TEMP/comparison/cold.metadata.json" \
            --warm-zip "$RUNNER_TEMP/comparison/warm.zip" \
            --warm-metadata "$RUNNER_TEMP/comparison/warm.metadata.json" \
            --jobs "$RUNNER_TEMP/comparison/jobs.json" \
            --output "$RUNNER_TEMP/comparison/result.json"
      - name: Upload comparison diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: benchmark-comparison-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/comparison/*.json
            ${{ runner.temp }}/comparison/*.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: false
          include-hidden-files: false
