name: Qualificar cenarios e viagem Save29 sem publicar
on:
  push:
    branches: [feat/scenes77-release]
    paths: ["firmware/**", "assets/**", "cartao/**", "docs/RELEASE_SCENES_7_7_NOTAS.txt", "tests/**", "tools/**", ".github/workflows/scenes77-check.yml", ".github/workflows/release.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scenes77-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    if: github.ref == 'refs/heads/feat/scenes77-release'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RPG_DETECT_LEAKS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Testar regressao completa, viagem diaria, Save29, reset e cenas
        run: bash tools/test_scenes77.sh
      - uses: arduino/setup-arduino-cli@v2
      - name: Instalar core ESP32 confirmado na placa
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.12
      - name: Compilar sem gravar nem publicar
        run: >-
          arduino-cli compile --jobs 4
          --fqbn 'esp32:esp32:esp32s3:CDCOnBoot=cdc,USBMode=hwcdc,UploadMode=default,CPUFreq=240,FlashMode=qio,FlashSize=16M,PartitionScheme=app3M_fat9M_16MB,PSRAM=opi,EraseFlash=none'
          --output-dir build firmware/RPG_POKET_2
      - name: Conferir identidade, USB obrigatorio, OTA Save29 e manifesto sem publicar
        run: |
          python3 tools/release_manifest.py
          python3 tools/verify_scenes77_release.py
          python3 tests/scenes77_release_verifier.py
          python3 tools/test_scenes77_release.py release
          python3 tools/test_scenes77_release.py release --sanitizers
      - name: Exigir capturas de todas as novas familias de telas
        run: |
          for pattern in 'mares-*' 'aurora-*' 'travel*' 'daily-*' 'defeat-*' 'level-*' 'clock-*'; do
            compgen -G "build/screens/$pattern.ppm" > /dev/null || { echo "Faltam capturas: $pattern"; exit 1; }
          done
      - name: Guardar arquivos qualificados e capturas para revisao
        uses: actions/upload-artifact@v4
        with:
          name: scenes77-${{ github.sha }}
          path: |
            release/firmware.bin
            release/artes.pak
            release/manifest.json
            build/screens/mares-*.ppm
            build/screens/aurora-*.ppm
            build/screens/travel*.ppm
            build/screens/daily-*.ppm
            build/screens/defeat-*.ppm
            build/screens/level-*.ppm
            build/screens/clock-*.ppm
          if-no-files-found: error
          retention-days: 14
