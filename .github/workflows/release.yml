name: Publicar versão
on:
  push:
    branches: [main]
    paths: ["firmware/**", "cartao/**", "assets/enemies-original1/**", "tests/**", "tools/**", ".github/workflows/release.yml"]
  workflow_dispatch:
    inputs:
      version:
        description: Versão inédita (ex. 2026.10.06-wifi1)
        required: true
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: recovery77-main
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RPG_DETECT_LEAKS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: arduino/setup-arduino-cli@v2
      - name: Identificar versao
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          from pathlib import Path
          import re,os
          version=re.search(r'FW_VERSION="([^"]+)"',Path("firmware/RPG_POKET_2/ReleaseVersion.h").read_text()).group(1)
          requested=os.environ.get("REQUESTED_VERSION")
          assert not requested or requested==version, "Versao diferente do firmware"
          assert version == "2026.10.13-recovery77", "Somente a recuperacao SD final qualificada"
          print("RELEASE_VERSION="+version)
          header=Path("firmware/RPG_POKET_2/ReleaseVersion.h").read_text()
          package=re.search(r'FW_PACKAGE="([^"]+)"',header)
          print("RELEASE_PACKAGE="+(package.group(1) if package else version))
          PY
      - name: Exigir qualificacao deste commit exato
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/recovery77-check.yml/runs?branch=feat%2Fota77-recovery&head_sha=$GITHUB_SHA&status=success&per_page=100" > "$RUNNER_TEMP/qualification.json"
          python3 - <<'PY'
          import json,os
          runs=json.load(open(os.environ['RUNNER_TEMP']+'/qualification.json'))['workflow_runs']
          assert any(r['head_sha']==os.environ['GITHUB_SHA'] and r['head_branch']=='feat/ota77-recovery' and r['path']=='.github/workflows/recovery77-check.yml' and r['conclusion']=='success' for r in runs), 'Fonte sem qualificacao exata'
          PY
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$RELEASE_VERSION" --jq 'length')" = 0
      - name: Testar gates focados de armazenamento e saves
        run: bash tools/test_ota_reliability.sh
      - name: Instalar ESP32
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.12
      - name: Compilar sem gravar
        run: >-
          arduino-cli compile --jobs 4
          --fqbn 'esp32:esp32:esp32s3:CDCOnBoot=cdc,USBMode=hwcdc,UploadMode=default,CPUFreq=240,FlashMode=qio,FlashSize=16M,PartitionScheme=app3M_fat9M_16MB,PSRAM=opi,EraseFlash=none'
          --output-dir build firmware/RPG_POKET_2
      - name: Preparar arquivos e manifesto
        run: |
          python3 tools/release_manifest.py
          python3 tools/verify_recovery77_release.py
          build/tests/update_adapter release/manifest.json
          python3 tests/recovery77_release_verifier.py
          python3 tools/test_recovery77_release.py release
          python3 tools/test_recovery77_release.py release --sanitizers
      - name: Publicar Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Refuse to reuse an existing tag; pin new tags to this tested source commit.
          existing=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$RELEASE_VERSION" --jq 'length')
          test "$existing" = 0
          gh release create "v$RELEASE_VERSION" release/firmware.bin release/artes.pak release/manifest.json --target "$GITHUB_SHA" --title "RPG POKET - $RELEASE_PACKAGE" --notes-file docs/RELEASE_RECOVERY_7_7_NOTAS.txt --latest
      - name: Conferir downloads publicados e manifesto latest
        run: |
          mkdir -p build/published77
          for name in firmware.bin artes.pak manifest.json; do
            curl --fail --location --retry 5 --retry-all-errors --output "build/published77/$name" "https://github.com/$GITHUB_REPOSITORY/releases/download/v$RELEASE_VERSION/$name"
            cmp "release/$name" "build/published77/$name"
          done
          python3 tools/verify_recovery77_release.py build/published77
          python3 tools/test_recovery77_release.py build/published77
          matched=0
          for attempt in $(seq 1 12); do
            if curl --fail --location --retry 2 --output build/published77/latest.json "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/manifest.json" && cmp release/manifest.json build/published77/latest.json; then matched=1; break; fi
            sleep 10
          done
          test "$matched" = 1
          echo "PASS: three public downloads byte-identical to tested outputs; SHA256, old/new real OTA adapters and latest manifest verified"
