name: Publicar versão
on:
  push:
    branches: [main, bolsa-dungeon, camp-development, lore-development, abrigo-development, paineis-development, paineis-development]
    paths: ["firmware/**", "cartao/**", "tests/**", "tools/**", ".github/workflows/release.yml"]
  workflow_dispatch:
    inputs:
      version:
        description: Versão inédita (ex. 2026.10.06-wifi1)
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Identificar versao
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          from pathlib import Path
          import re,os
          version=re.search(r'FW_VERSION="([^"]+)"',Path("firmware/RPG_POKET_2/ReleaseVersion.h").read_text()).group(1)
          requested=os.environ.get("REQUESTED_VERSION")
          assert not requested or requested==version, "Versao diferente do firmware"
          print("RELEASE_VERSION="+version)
          header=Path("firmware/RPG_POKET_2/ReleaseVersion.h").read_text()
          package=re.search(r'FW_PACKAGE="([^"]+)"',header)
          print("RELEASE_PACKAGE="+(package.group(1) if package else version))
          PY
      - name: Testar regras, saves e telas
        run: bash tools/test_native.sh
      - name: Guardar previas da dungeon
        uses: actions/upload-artifact@v4
        with:
          name: dungeon-previews
          path: |
            build/screens/dungeon-*.ppm
            build/screens/camp-*.ppm
            build/screens/lore-*.ppm
            build/screens/day-*.ppm
            build/screens/event-*.ppm
            build/screens/origens-*.ppm
            build/screens/exploration-*.ppm
            build/screens/locks-*.ppm
            build/screens/progression-*.ppm
            build/screens/attribute-*.ppm
            build/commerce75-economy.csv
            build/screens/commerce75-*.ppm
            build/progressao.csv
            build/balance74-rewards.csv
            build/screens/campaign-*.ppm
            build/screens/launch-*.ppm
            build/screens/powers-*.ppm
            build/screens/experience72-*.ppm
            build/screens/title-*.ppm
            build/screens/scenic-*.ppm
            build/screens/panels-*.ppm
            build/screens/panels-*.ppm
      - name: Instalar ESP32
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.12
      - name: Compilar sem gravar
        run: >-
          arduino-cli compile --jobs 4
          --fqbn 'esp32:esp32:esp32s3:CDCOnBoot=cdc,USBMode=hwcdc,UploadMode=default,CPUFreq=240,FlashMode=qio,FlashSize=16M,PartitionScheme=app3M_fat9M_16MB,PSRAM=opi,EraseFlash=none'
          --output-dir build firmware/RPG_POKET_2
      - name: Preparar arquivos e manifesto
        run: |
          python3 tools/release_manifest.py
          python3 tools/verify_release.py
          build/tests/update_adapter release/manifest.json
      - name: Publicar Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Refuse to reuse an existing tag; pin new tags to this tested source commit.
          existing=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$RELEASE_VERSION" --jq 'length')
          test "$existing" = 0
          gh release create "v$RELEASE_VERSION" release/firmware.bin release/artes.pak release/manifest.json --target "$GITHUB_SHA" --title "RPG POKET - $RELEASE_PACKAGE" --notes "$RELEASE_PACKAGE ($RELEASE_VERSION). Waveshare SKU29667. Instale a primeira versao pelo cabo; depois Configuracoes > Atualizacao. Firmware e artes com SHA-256. Save28 e 488 artes preservados. Teste fisico 7.6 e memoria em execucao pendentes; publicacao autorizada pelo proprietario sem teste na placa. Fadiga auxiliar incerta reinicia em zero, preservando o heroi. Downgrade com exclusao/recriacao identica nao e garantido. Regras, recuperacao e limites: https://github.com/Oflodorporto/RPG-POKET-2/blob/$GITHUB_SHA/docs/PACOTE_7_6_FADIGA_DESCANSO_PLANO.txt"
