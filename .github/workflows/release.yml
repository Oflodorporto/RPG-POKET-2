name: Publicar pulso do relogio apos autorizacao e SHA qualificado
# Prepared infrastructure is not publication authorization.
# Only an independently authorized main push may start this release.
# Qualification branches never publish. Historical tools remain unchanged.
on:
  push:
    branches: [main]
    paths: ["firmware/**", "assets/**", "cartao/**", "docs/RELEASE_PACKAGE9_NOTAS.txt", "tests/**", "tools/**", ".github/workflows/release.yml"]
permissions:
  contents: write
  actions: read
concurrency:
  group: package9-main
  cancel-in-progress: false
jobs:
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    env:
      RPG_DETECT_LEAKS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Exigir main push e qualificacao do SHA exato
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/main
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/package9-check.yml/runs?branch=feat%2Fpackage9-release&head_sha=$GITHUB_SHA&status=success&per_page=100" > "$RUNNER_TEMP/qualification.json"
          python3 tools/check_package9_release_gate.py "$RUNNER_TEMP/qualification.json"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v2026.10.14-clock77" --jq 'length')" = 0
      - name: Instalar dependencia deterministica das artes
        run: python3 -m pip install 'Pillow==11.3.0'
      - name: Rerodar agregado herdado completo e relogio no SHA aprovado
        run: |
          mkdir -p build
          bash tools/test_package9.sh 2>&1 | tee build/package9-tests.log
      - uses: arduino/setup-arduino-cli@v2
      - name: Instalar ESP32
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.12
      - name: Compilar e verificar bytes finais
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          arduino-cli version | tee build/package9-esp32-build.log
          arduino-cli compile --jobs 4 \
            --fqbn 'esp32:esp32:esp32s3:CDCOnBoot=cdc,USBMode=hwcdc,UploadMode=default,CPUFreq=240,FlashMode=qio,FlashSize=16M,PartitionScheme=app3M_fat9M_16MB,PSRAM=opi,EraseFlash=none' \
            --build-path build/esp32-package9 --export-binaries=false firmware/RPG_POKET_2 2>&1 | tee -a build/package9-esp32-build.log
          cp build/esp32-package9/RPG_POKET_2.ino.bin build/RPG_POKET_2.ino.bin
          python3 tools/check_package9_scope.py
          python3 tools/release_package9_manifest.py
          python3 tools/verify_package9_release.py
          python3 tests/package9_release_verifier.py
          python3 tools/test_package9_release.py release
          python3 tools/test_package9_release.py release --sanitizers
          python3 tools/check_package9_scope.py
          python3 -c 'import sys,subprocess; sys.path.insert(0,"tools"); from record_package9_identity import assert_generated_only; assert_generated_only(subprocess.check_output(["git","status","--porcelain","--untracked-files=all"],text=True).strip())'
      - name: Publicar somente SHA main autorizado e qualificado
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v2026.10.14-clock77" --jq 'length')" = 0
          gh release create v2026.10.14-clock77 release/firmware.bin release/artes.pak release/manifest.json --target "$GITHUB_SHA" --title 'RPG POKET - 7.7 - Pulso do relogio' --notes-file docs/RELEASE_PACKAGE9_NOTAS.txt --latest
      - name: Conferir downloads publicos e manifesto latest
        run: |
          mkdir -p build/published-package9
          for name in firmware.bin artes.pak manifest.json; do
            curl --fail --location --retry 5 --retry-all-errors --output "build/published-package9/$name" "https://github.com/$GITHUB_REPOSITORY/releases/download/v2026.10.14-clock77/$name"
            cmp "release/$name" "build/published-package9/$name"
          done
          python3 tools/verify_package9_release.py build/published-package9
          python3 tools/test_package9_release.py build/published-package9
          matched=0
          for attempt in $(seq 1 12); do
            if curl --fail --location --retry 2 --output build/published-package9/latest.json "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/manifest.json" && cmp release/manifest.json build/published-package9/latest.json; then matched=1; break; fi
            sleep 10
          done
          test "$matched" = 1
